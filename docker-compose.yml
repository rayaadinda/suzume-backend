services:
  postgres:
    image: postgres:17-alpine
    container_name: task-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-suzume}
      POSTGRES_USER: ${POSTGRES_USER:-suzume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suzume_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suzume} -d ${POSTGRES_DB:-suzume}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  api:
    build: .
    container_name: task-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://${POSTGRES_USER:-suzume}:${POSTGRES_PASSWORD:-suzume_dev_password}@postgres:5432/${POSTGRES_DB:-suzume}?sslmode=disable
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres-data:
